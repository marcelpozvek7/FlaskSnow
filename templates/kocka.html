<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <title>Kocka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎲 Metanje kocke</h1>
        <p>Vrgel si:</p>
        <div class="result">{{ kocka }}</div>
    </div>
</body>
</html>
<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Poppins:wght@400;500;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 20%, #46118f 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #092c70 0%, transparent 35%),
        #080816;
    overflow: hidden;
}

.container {
    position: relative;
    text-align: center;
    padding: 65px 85px;
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(174, 92, 255, 0.35);
    box-shadow:
        0 0 40px rgba(135, 40, 255, 0.2),
        inset 0 0 30px rgba(255, 255, 255, 0.02);
    backdrop-filter: blur(20px);
    animation: appear 0.8s ease;
}

h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 35px;
    background: linear-gradient(90deg, #c084fc, #60a5fa);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
}

p {
    font-size: 18px;
    color: #aaa9c5;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 20px;
}

.result {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 160px;
    height: 160px;
    border-radius: 30px;
    font-family: 'Orbitron', sans-serif;
    font-size: 85px;
    font-weight: 800;
    color: white;
    background: linear-gradient(145deg, #9333ea, #4f46e5);
    box-shadow:
        0 15px 35px rgba(124, 58, 237, 0.4),
        0 0 50px rgba(147, 51, 234, 0.3),
        inset 0 3px 10px rgba(255, 255, 255, 0.3);
    border: 2px solid rgba(255, 255, 255, 0.3);
    animation: dice 0.8s cubic-bezier(.17,.67,.35,1.3);
}

.container::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 30px;
    background: linear-gradient(135deg, #a855f7, transparent, #3b82f6);
    z-index: -1;
    opacity: 0.5;
    filter: blur(20px);
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes dice {
    0% {
        transform: rotate(-180deg) scale(0);
        opacity: 0;
    }
    100% {
        transform: rotate(0) scale(1);
        opacity: 1;
    }
}

@media (max-width: 600px) {
    .container {
        padding: 45px 30px;
        width: 90%;
    }

    h1 {
        font-size: 23px;
    }

    .result {
        width: 130px;
        height: 130px;
        font-size: 70px;
    }
}

</style>
